{% set name = "pycvodes" %}
{% set version = "0.15.0" %}
{% set sha256 = "ad04cedb9ec618c6287b12ae4dc417353457934a6569c6a9078bf95df3295288" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  skip: true  # [win and not py>=35]
  features:

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - libblas
    - liblapack
    - sundials <7
    - python
    - setuptools
    - pip
    - numpy
    - cython
  run:
    - sundials <7
    - python
    - setuptools  # pkg_resources used

test:
  imports:
    - pycvodes
  requires:
    - pytest
  commands:
    - python -m pytest --pyargs {{ name }}
    - python -c "import pathlib as p; from pycvodes import get_include as g; assert open(p.Path(g()) / 'cvodes_cxx.hpp', 'rt').read().startswith('#pragma once')"

about:
  home: https://github.com/bjodah/{{ name }}
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Python wrapper around cvodes (from the sundials library)
  doc_url: https://bjodah.github.io/{{ name }}/latest


extra:
  recipe-maintainers:
    - bjodah
    - moorepants
